# Global pipeline configuration. Secrets are NOT stored here (see .env).
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  quarantine_dir: data/quarantine
  db_path: data/processed/aqp.db

logging:
  level: INFO
  json: false

ingestion:
  # OpenAQ v3
  openaq_base_url: https://api.openaq.org/v3
  open_meteo_base_url: https://archive-api.open-meteo.com/v1/archive
  # HTTP resilience
  max_retries: 5
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0
  request_timeout_seconds: 30
  page_limit: 1000
  # Politeness: min seconds between requests to the same host
  min_request_interval_seconds: 0.2

pollutants:
  # OpenAQ parameter name -> canonical name + canonical unit + plausible domain range
  pm25: {canonical: pm25, unit: "ug/m3", min: 0.0, max: 1000.0}
  pm10: {canonical: pm10, unit: "ug/m3", min: 0.0, max: 2000.0}
  no2:  {canonical: no2,  unit: "ug/m3", min: 0.0, max: 1000.0}
  so2:  {canonical: so2,  unit: "ug/m3", min: 0.0, max: 1000.0}
  co:   {canonical: co,   unit: "ug/m3", min: 0.0, max: 100000.0}
  o3:   {canonical: o3,   unit: "ug/m3", min: 0.0, max: 1000.0}

weather:
  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - surface_pressure
    - wind_speed_10m
    - wind_direction_10m

features:
  rolling_window_hours: 24
  lags: [1, 3, 6, 12, 24]
  ewma_lambda: 0.2
  cusum_k_sigma: 0.5      # allowance (slack) in std units
  cusum_h_sigma: 5.0      # decision threshold in std units
  cusum_min_persistence: 3  # consecutive alarms required to open an event

statistics:
  iqr_k: 1.5
  iqr_k_extreme: 3.0
  mad_threshold: 3.5       # robust-z cutoff (Iglewicz & Hoaglin)
  hampel_window: 7
  hampel_n_sigma: 3.0
  bootstrap_iterations: 2000
  default_confidence: 0.95
