# Target cities. Coordinates are used both for OpenAQ location discovery
# (coordinates + radius) and for the Open-Meteo weather pull.
# Keep this list small (4-6 cities) to stay within rate limits.
cities:
  - name: London
    country: GB
    latitude: 51.5074
    longitude: -0.1278
    timezone: Europe/London
    search_radius_m: 25000
  - name: Paris
    country: FR
    latitude: 48.8566
    longitude: 2.3522
    timezone: Europe/Paris
    search_radius_m: 25000
  - name: Berlin
    country: DE
    latitude: 52.5200
    longitude: 13.4050
    timezone: Europe/Berlin
    search_radius_m: 25000
  - name: Madrid
    country: ES
    latitude: 40.4168
    longitude: -3.7038
    timezone: Europe/Madrid
    search_radius_m: 25000
  - name: Delhi
    country: IN
    latitude: 28.6139
    longitude: 77.2090
    timezone: Asia/Kolkata
    search_radius_m: 25000
  - name: Los Angeles
    country: US
    latitude: 34.0522
    longitude: -118.2437
    timezone: America/Los_Angeles
    search_radius_m: 25000

# Max OpenAQ monitoring locations to keep per city (keeps station count manageable).
max_stations_per_city: 4
